<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#176B4B" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1D14" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SANZAR — Learn Today, Lead Tomorrow</title>
    <meta name="description" content="SANZAR — Chinese Language Learning Platform. Learn Today, Lead Tomorrow." />
    <meta property="og:title" content="SANZAR — Learn Today, Lead Tomorrow" />
    <meta property="og:description" content="Chinese Language Learning Platform for students." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/brand/sanzar-og-social-card-1200x630.png" />

    <link rel="preload" href="/fonts/Kalpurush.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('sanzar.theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
            if (t !== 'light') localStorage.setItem('sanzar.theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
