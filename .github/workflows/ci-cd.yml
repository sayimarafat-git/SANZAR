name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Flutter
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl unzip libgl1-mesa-dev libglu1-mesa-dev
          curl -sSL https://storage.googleapis.com/flutter/releases/flutter_linux_3.19.0-stable.tar.xz -o flutter.tar.xz
          tar -xf flutter.tar.xz
          export PATH=$PATH:$PWD/flutter/bin
          flutter doctor -v

      - name: Install Android SDK
        run: |
          sudo apt-get install -y wget unzip
          mkdir -p $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools
          export ANDROID_HOME=$HOME/android-sdk/cmdline-tools
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/bin:$ANDROID_HOME/platform-tools
          yes | $ANDROID_HOME/cmdline-tools/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"
          $ANDROID_HOME/cmdline-tools/bin/sdkmanager --licenses

      - name: Install dependencies (admin)
        run: |
          cd apps/admin
          npm ci

      - name: Install dependencies (api)
        run: |
          cd apps/api
          npm ci

      - name: Build admin app
        run: |
          cd apps/admin
          npm run build

      - name: Build Flutter mobile app
        run: |
          cd apps/mobile
          export ANDROID_HOME=$HOME/android-sdk/cmdline-tools
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/bin:$ANDROID_HOME/platform-tools
          flutter build apk --release

      - name: Deploy API to Cloudflare
        env:
          WRANGLER_API_TOKEN: ${{ secrets.WRANGLER_API_TOKEN }}
          WRANGLER_ACCOUNT_ID: ${{ secrets.WRANGLER_ACCOUNT_ID }}
        run: |
          cd apps/api
          npx --yes wrangler@4.166.0 deploy --env production

      - name: Deploy admin app to Cloudflare Pages (optional)
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          cd apps/admin
          npx vercel --prod --token $VERCEL_TOKEN

      - name: Deploy admin app to Netlify (fallback)
        if: ${{ secrets.VERCEL_TOKEN == '' && secrets.NETLIFY_TOKEN != '' }}
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
        run: |
          cd apps/admin
          npx netlify deploy --prod --dir=apps/admin --token=$NETLIFY_TOKEN