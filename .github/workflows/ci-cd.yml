name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Test & Validate Cloudflare Worker API
        run: |
          cd apps/api
          npm ci
          npm test

      - name: Build Web Application (Cloudflare Pages)
        run: |
          cd apps/web
          npm ci
          npm run build

      - name: Build Native Android APK
        run: |
          cd apps/android
          chmod +x ./gradlew || true
          # When Gradle wrapper is committed, ./gradlew assembleRelease builds Sanzar.apk

      - name: Deploy API to Cloudflare Worker
        if: ${{ secrets.WRANGLER_API_TOKEN != '' }}
        env:
          WRANGLER_API_TOKEN: ${{ secrets.WRANGLER_API_TOKEN }}
          WRANGLER_ACCOUNT_ID: ${{ secrets.WRANGLER_ACCOUNT_ID }}
        run: |
          cd apps/api
          npx --yes wrangler@4.166.0 deploy
